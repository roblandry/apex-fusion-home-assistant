name: Release on version bump

# When a push to main changes the version in manifest.json, tag it and publish a
# GitHub release. Nothing is committed back to main: the version-bump PR already
# carries the CHANGELOG.md section.
#
# Release notes: the hand-written CHANGELOG.md section for the version if there
# is one, otherwise notes generated by git-cliff (cliff.toml) from the
# Conventional Commits since the previous tag.
#
# Recovery for a missed release is manual; see docs/RELEASE.md.
on:
  push:
    branches: [main]
    paths:
      - "custom_components/apex_fusion/manifest.json"
      - ".github/workflows/release-on-version-bump.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release if the version is new
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install awesomeversion (what HA and HACS use to rank versions)
        run: python3 -m pip install --quiet awesomeversion==25.8.0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/bump-version.py --get)
          python3 scripts/bump-version.py --check
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            if [[ "$VERSION" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Version on main: $VERSION"

      - name: Skip if the tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the version increased
        if: steps.tag_check.outputs.skip == 'false'
        env:
          BEFORE: ${{ github.event.before }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "::error::No previous commit to compare against."
            exit 1
          fi
          BASE_DIR="$RUNNER_TEMP/base"
          git worktree add --detach "$BASE_DIR" "$BEFORE"
          BASE_VERSION=$(python3 scripts/bump-version.py --root "$BASE_DIR" --get)
          if [[ "$BASE_VERSION" == "$VERSION" ]]; then
            # Tag is missing but the version did not change in this push: an
            # earlier release attempt failed. Allow the retry.
            echo "::notice::Version unchanged at $VERSION but tag is missing; releasing it."
          elif ! python3 scripts/bump-version.py --check-increase "$BASE_VERSION"; then
            echo "::error::Version went from $BASE_VERSION to $VERSION, which is not an increase. Refusing to tag."
            exit 1
          fi

      - name: Find release notes
        id: notes
        if: steps.tag_check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py --changelog-notes > "$RUNNER_TEMP/handwritten.md"
          if [[ -s "$RUNNER_TEMP/handwritten.md" ]]; then
            echo "Using the CHANGELOG.md section."
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section; generating notes from commits."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate notes from commits (git-cliff)
        if: steps.tag_check.outputs.skip == 'false' && steps.notes.outputs.generate == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --strip all
        env:
          OUTPUT: generated-notes.md

      - name: Tag and publish the release
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          set -euo pipefail
          if [[ "$GENERATE" == "true" ]]; then
            NOTES_FILE=generated-notes.md
          else
            NOTES_FILE="$RUNNER_TEMP/handwritten.md"
          fi
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Release $TAG." > "$NOTES_FILE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$NOTES_FILE" "${ARGS[@]}"
