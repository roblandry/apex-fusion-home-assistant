name: Release on version bump

# When a push to main changes the version in manifest.json, tag it and publish a
# GitHub release. Nothing is committed back to main: the version-bump PR already
# carries the CHANGELOG.md section.
#
# A release is cut only when a push raises the version (strictly, and not dated
# in the future). A push that leaves the version alone never releases; recover a
# missed release by hand, see docs/RELEASE.md.
#
# Release notes: the hand-written CHANGELOG.md section for the version if there
# is one, otherwise notes generated by git-cliff (cliff.toml) from the
# Conventional Commits since the previous tag.
#
# Recovery for a missed release is manual; see docs/RELEASE.md.
on:
  push:
    branches: [main]
    paths:
      - "custom_components/apex_fusion/manifest.json"
      - ".github/workflows/release-on-version-bump.yml"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release if the version is new
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag and create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true # the "Tag and publish the release" step pushes the tag with these credentials

      - name: Install version-ordering packages
        run: python3 -m pip install --quiet awesomeversion==25.8.0 packaging==26.3

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/bump-version.py --get)
          python3 scripts/bump-version.py --check
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            if [[ "$VERSION" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "Version on main: $VERSION"

      - name: Decide whether to release
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "::error::No previous commit to compare against."
            exit 1
          fi
          BASE_DIR="$RUNNER_TEMP/base"
          git worktree add --detach "$BASE_DIR" "$BEFORE"
          BASE_VERSION=$(python3 scripts/bump-version.py --root "$BASE_DIR" --get)
          if [[ "$BASE_VERSION" == "$VERSION" ]]; then
            echo "Version unchanged at $VERSION in this push; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Strictly greater than the previous version, not dated in the future.
          if ! python3 scripts/bump-version.py --check-increase "$BASE_VERSION"; then
            echo "::error::Version went from $BASE_VERSION to $VERSION, which is not a valid increase. Refusing to tag."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find release notes
        id: notes
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py --changelog-notes > "$RUNNER_TEMP/handwritten.md"
          if [[ -s "$RUNNER_TEMP/handwritten.md" ]]; then
            echo "Using the CHANGELOG.md section."
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section; generating notes from commits."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate notes from commits (git-cliff)
        if: steps.decide.outputs.release == 'true' && steps.notes.outputs.generate == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --strip all
        env:
          OUTPUT: generated-notes.md

      - name: Tag and publish the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GENERATE: ${{ steps.notes.outputs.generate }}
        run: |
          set -euo pipefail
          if [[ "$GENERATE" == "true" ]]; then
            NOTES_FILE=generated-notes.md
          else
            NOTES_FILE="$RUNNER_TEMP/handwritten.md"
          fi
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Release $TAG." > "$NOTES_FILE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$NOTES_FILE" "${ARGS[@]}"
