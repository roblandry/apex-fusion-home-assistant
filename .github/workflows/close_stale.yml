name: Close Stale Issues

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write # label, comment on and close stale issues
      pull-requests: write # actions/stale also scans pull requests
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-labels: 'bug'
          stale-issue-message: 'This issue is stale because it has not been updated in a while.'
          close-issue-message: 'Closing this issue due to inactivity.'
          days-before-stale: 30
          days-before-close: 7
