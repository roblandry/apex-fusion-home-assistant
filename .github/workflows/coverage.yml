name: Tests & Coverage

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the "Commit updated badge" step pushes badges/coverage.svg to the default branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.12"
            constraints: constraints-ha2025.txt
          - ha: "2026.1"
            constraints: constraints-ha2026.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # the "Commit updated badge" step pushes with these credentials

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.test.txt
            constraints-ha2025.txt
            constraints-ha2026.txt

      - name: Install test dependencies
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip

          python -c "import json; print('\\n'.join(json.load(open('custom_components/apex_fusion/manifest.json'))['requirements']))" > /tmp/manifest_requirements.txt
          pip install -r /tmp/manifest_requirements.txt -c "$CONSTRAINTS"
          pip install -r requirements.txt -c "$CONSTRAINTS"

      - name: Run tests with coverage (HA ${{ matrix.ha }})
        if: matrix.ha == '2026.1'
        run: |
          pytest -q \
            --cov=custom_components \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Run tests (HA ${{ matrix.ha }})
        if: matrix.ha != '2026.1'
        run: |
          pytest -q

      - name: Generate coverage badge (repo-local)
        if: matrix.ha == '2026.1'
        run: |
          mkdir -p badges
          # Use genbadge instead of coverage_badge to avoid pkg_resources/setuptools issues on Py3.13.
          python -m pip install --upgrade "genbadge[coverage]"
          genbadge coverage -i coverage.xml -o badges/coverage.svg

      - name: Upload coverage.xml to Codecov
        if: matrix.ha == '2026.1'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Commit updated badge
        if: matrix.ha == '2026.1' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if git diff --quiet -- badges/coverage.svg; then
            echo "No badge changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge"
          git push
