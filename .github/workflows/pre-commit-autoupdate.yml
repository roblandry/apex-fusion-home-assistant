name: pre-commit autoupdate

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create-pull-request pushes the autoupdate branch
      pull-requests: write # create-pull-request opens the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # create-pull-request authenticates with its own token input

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Autoupdate hooks
        run: |
          pre-commit autoupdate

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ci/pre-commit-autoupdate
          delete-branch: true
          title: "chore(pre-commit): autoupdate hooks"
          commit-message: "chore(pre-commit): autoupdate hooks"
          body: |
            Automated `pre-commit autoupdate`.
