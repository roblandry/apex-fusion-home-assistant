name: pre-commit autoupdate

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create-pull-request pushes the autoupdate branch
      pull-requests: write # create-pull-request opens the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # create-pull-request authenticates with its own token input

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Autoupdate hooks
        run: |
          pre-commit autoupdate

      - name: Create PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: ci/pre-commit-autoupdate
          delete-branch: true
          title: "chore(pre-commit): autoupdate hooks"
          commit-message: "chore(pre-commit): autoupdate hooks"
          body: |
            Automated `pre-commit autoupdate`.
