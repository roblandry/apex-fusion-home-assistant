name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read # checkout the repository
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Detect HACS metadata
        id: hacs_meta
        shell: bash
        run: |
          if [ -f "hacs.json" ]; then
            echo "has_hacs_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_hacs_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: HACS validation
        if: steps.hacs_meta.outputs.has_hacs_json == 'true' || github.event_name == 'workflow_dispatch'
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: "integration"
